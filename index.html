<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      #audio-btn {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 999;
        padding: 12px 24px;
        background-color: #111111;
        color: #ffffff;
        border: 2px solid #ffffff;
        border-radius: 25px;
        font-family: sans-serif;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      }
    </style>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <button id="audio-btn">🔊 Toca para activar audio</button>

    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <video id="video-member" src="./yoongi.mp4" loop crossorigin="anonymous" playsinline webkit-playsinline></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-video src="#video-member" width="1" height="1" position="0 0 0" rotation="0 0 0"></a-video>
      </a-entity>
    </a-scene>

    <script>
      const audioBtn = document.querySelector('#audio-btn');
      const video = document.querySelector('#video-member');

      audioBtn.addEventListener('click', () => {
        if (video) video.muted = false;
        audioBtn.style.display = 'none';
      });

      const sceneEl = document.querySelector('a-scene');
      sceneEl.addEventListener("arReady", () => {
        const target = document.querySelector('[mindar-image-target]');
        target.addEventListener("targetFound", () => {
          if (video) video.play();
        });
        target.addEventListener("targetLost", () => {
          if (video) video.pause();
        });
      });
    </script>
  </body>
</html>
